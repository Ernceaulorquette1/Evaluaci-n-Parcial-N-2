name: Pipeline CI/CD EP2 DevOps

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    name: Ejecutar pruebas automatizadas
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Ejecutar pruebas con PyTest
        run: |
          pytest tests/

  security:
    name: Análisis de seguridad
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Escaneo de vulnerabilidades con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "HIGH,CRITICAL"
          exit-code: "1"

  build:
    name: Construir imagen Docker
    runs-on: ubuntu-latest
    needs: security

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Construir imagen Docker
        run: |
          docker build -t microservicio-devops:latest .

      - name: Verificar imagen Docker
        run: |
          docker images

  deploy:
    name: Despliegue simulado con Docker Compose
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Desplegar con Docker Compose
        run: |
          docker compose up -d --build

      - name: Verificar contenedores activos
        run: |
          docker ps

      - name: Probar endpoint del microservicio
        run: |
          sleep 10
          curl http://localhost:5000/health